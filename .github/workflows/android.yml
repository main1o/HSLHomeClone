name: Build Android APK (Miuix)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write           # 允许用内置 GITHUB_TOKEN 创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Miuix v0.9.4 官方仓库使用 JDK 21 + AGP 9.4.1 + Kotlin 2.4.20 + Gradle 9.7.1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 必须显式传 packages：setup-android@v3 的默认值是 'tools platform-tools'，
      # 而 legacy `tools` 包已从 Google 仓库下架（repository2-3.xml 中已不存在），
      # 不传就会在 sdkmanager 上挂掉。
      #
      # 平台包名也不能写 platforms;android-37：API 37 起改用 minor api level
      # 命名，仓库里实际是 android-37.0 / 37.1 / 37.2，对应 AGP DSL 的
      # release(37) { minorApiLevel = 0 }。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platforms;android-37.0
            platforms;android-37.1
            platforms;android-37.2
            build-tools;37.0.0
            platform-tools

      # 诊断 + 容错补装：列出仓库可用平台与本地已装目录，个别包缺失也不中断 job
      - name: Verify installed SDK components
        shell: bash
        run: |
          set +e
          echo "::group::platforms available in sdkmanager repository"
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3" || true
          echo "::endgroup::"
          for pkg in "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"; do
            yes | sdkmanager "$pkg" || echo "::warning::retry install failed for $pkg"
          done
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "=== $SDK_DIR/platforms ==="
          ls -1 "$SDK_DIR/platforms" || true
          echo "=== $SDK_DIR/build-tools ==="
          ls -1 "$SDK_DIR/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Artifacts 备份)
        uses: actions/upload-artifact@v4
        with:
          name: HSLMiuix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: HSL Miuix dev-${{ github.run_number }} (${{ github.sha }})
          body: |
            自动构建产物（每次 workflow 运行更新）。
            - UI 框架：Miuix (top.yukonga.miuix.kmp) 0.9.4
            - Commit: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
            - 类型: Debug APK（调试签名，可直接安装）
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
