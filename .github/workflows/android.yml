name: Build Android APK (Miuix)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write           # 允许用内置 GITHUB_TOKEN 创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Miuix v0.9.4 官方仓库使用 JDK 21 + AGP 9.4.1 + Kotlin 2.4.20 + Gradle 9.7.1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;37.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Artifacts 备份)
        uses: actions/upload-artifact@v4
        with:
          name: HSLMiuix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: HSL Miuix dev-${{ github.run_number }} (${{ github.sha }})
          body: |
            自动构建产物（每次 workflow 运行更新）。
            - UI 框架：Miuix (top.yukonga.miuix.kmp) 0.9.4
            - Commit: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
            - 类型: Debug APK（调试签名，可直接安装）
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
